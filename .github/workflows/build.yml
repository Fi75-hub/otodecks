name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE 8.0.10
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/JUCE"
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_SOURCE_DIR=$env:RUNNER_TEMP/JUCE" -DOTODECKS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test audio processing
        run: ctest --test-dir build -C Release --output-on-failure
